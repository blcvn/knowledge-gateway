services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: kg_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kg_service"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  memgraph:
    image: ${MEMGRAPH_IMAGE:-memgraph/memgraph:3.11.0}
    depends_on:
      memgraph-kernel-init:
        condition: service_completed_successfully
    ports:
      - "7687:7687"
      - "7444:7444"
    volumes:
      - memgraph-data:/var/lib/memgraph
    command:
      - --log-level=INFO
      - --metrics-format=OpenMetrics

  memgraph-kernel-init:
    image: alpine:3.20
    privileged: true
    pid: host
    command:
      - /bin/sh
      - -ec
      - |
        sysctl -w vm.max_map_count=524288
        sysctl vm.max_map_count

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.9.7}
    ports:
      - "6333:6333"

  migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../../migrations:/migrations:ro
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://postgres:postgres@postgres:5432/kg_service?sslmode=disable",
        "up"
      ]

  qdrant-init:
    image: curlimages/curl:8.10.1
    depends_on:
      qdrant:
        condition: service_started
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >
        until curl -fsS http://qdrant:6333/healthz >/dev/null; do sleep 2; done;
        status=$$(curl -sS -o /dev/null -w "%{http_code}" -X PUT -H "Content-Type: application/json" "http://qdrant:6333/collections/${KG_VECTOR_COLLECTION:-kg_vectors}" -d '{"vectors":{"size":1024,"distance":"Cosine"}}');
        case "$$status" in 200|201|409) exit 0 ;; *) exit 1 ;; esac
    restart: "no"

  kg-service:
    build:
      context: ../../..
      dockerfile: Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant-init:
        condition: service_completed_successfully
    environment:
      KG_HTTP_HOST: 0.0.0.0
      KG_HTTP_PORT: 8082
      KG_POSTGRES_HOST: postgres
      KG_POSTGRES_PORT: 5432
      KG_POSTGRES_USER: postgres
      KG_POSTGRES_PASSWORD: postgres
      KG_POSTGRES_DATABASE: kg_service
      KG_POSTGRES_SSLMODE: disable
      KG_REDIS_HOST: redis
      KG_REDIS_PORT: 6379
      KG_REDIS_DB: 0
      KG_RUNTIME_PROFILE: qdrant-memgraph
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-http}
      EMBEDDING_URL: ${EMBEDDING_URL}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
      VECTOR_ADAPTER: qdrant
      KG_VECTOR_ENDPOINT: http://qdrant:6333
      KG_VECTOR_COLLECTION: ${KG_VECTOR_COLLECTION:-kg_vectors}
      GRAPH_ADAPTER: memgraph
      KG_GRAPH_ENDPOINT: bolt://memgraph:7687
      KG_GRAPH_DATABASE: ${KG_GRAPH_DATABASE:-kg}
      FTS_ADAPTER: postgres
      KG_RATE_LIMIT_FREE: ${KG_RATE_LIMIT_FREE:-200000}
      KG_RATE_LIMIT_PRO: ${KG_RATE_LIMIT_PRO:-200000}
      KG_RATE_LIMIT_ENTERPRISE: ${KG_RATE_LIMIT_ENTERPRISE:-200000}
    ports:
      - "8082:8082"

volumes:
  memgraph-data:
