services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: kg_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kg_service"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  memgraph:
    image: ${MEMGRAPH_IMAGE:-memgraph/memgraph:5.9.0}
    ports:
      - "7688:7687"

  migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../../migrations:/migrations:ro
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://postgres:postgres@postgres:5432/kg_service?sslmode=disable",
        "up"
      ]

  kg-service:
    build:
      context: ../../..
      dockerfile: Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      KG_HTTP_HOST: 0.0.0.0
      KG_HTTP_PORT: 8082
      KG_POSTGRES_HOST: postgres
      KG_POSTGRES_PORT: 5432
      KG_POSTGRES_USER: postgres
      KG_POSTGRES_PASSWORD: postgres
      KG_POSTGRES_DATABASE: kg_service
      KG_POSTGRES_SSLMODE: disable
      KG_REDIS_HOST: redis
      KG_REDIS_PORT: 6379
      KG_REDIS_DB: 0
      KG_RUNTIME_PROFILE: pgvector-memgraph
      EMBEDDING_PROVIDER: deterministic
      VECTOR_ADAPTER: pgvector
      KG_VECTOR_ENDPOINT: ""
      KG_VECTOR_COLLECTION: kg_vectors
      GRAPH_ADAPTER: memgraph
      KG_GRAPH_ENDPOINT: bolt://memgraph:7687
      KG_GRAPH_DATABASE: kg
      FTS_ADAPTER: postgres
    ports:
      - "8082:8082"
