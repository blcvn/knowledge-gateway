services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: kg_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kg_service"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:5.9.0-community}
    environment:
      NEO4J_AUTH: none
    ports:
      - "7474:7474"
      - "7687:7687"

  memgraph:
    image: ${MEMGRAPH_IMAGE:-memgraph/memgraph:5.9.0}
    ports:
      - "7688:7687"

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.9.7}
    ports:
      - "6333:6333"

  etcd:
    image: ${ETCD_IMAGE:-quay.io/coreos/etcd:v3.5.16}
    command:
      [
        "etcd",
        "--advertise-client-urls=http://etcd:2379",
        "--listen-client-urls=http://0.0.0.0:2379",
        "--data-dir=/etcd"
      ]
    ports:
      - "2379:2379"

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2024-06-13T22-53-53Z}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"

  milvus:
    image: ${MILVUS_IMAGE:-milvusdb/milvus:v2.6.18}
    command: ["milvus", "run", "standalone"]
    depends_on:
      etcd:
        condition: service_started
      minio:
        condition: service_started
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "19530:19530"

  nebula-metad:
    image: ${NEBULA_METAD_IMAGE:-vesoft/nebula-metad:v3.8.0}
    command:
      [
        "--meta_server_addrs=nebula-metad:9559",
        "--local_ip=nebula-metad",
        "--port=9559"
      ]
    ports:
      - "9559:9559"

  nebula-storaged:
    image: ${NEBULA_STORAGED_IMAGE:-vesoft/nebula-storaged:v3.8.0}
    command:
      [
        "--meta_server_addrs=nebula-metad:9559",
        "--local_ip=nebula-storaged",
        "--port=9779"
      ]
    depends_on:
      nebula-metad:
        condition: service_started

  nebula-graphd:
    image: ${NEBULA_GRAPHD_IMAGE:-vesoft/nebula-graphd:v3.8.0}
    command:
      [
        "--meta_server_addrs=nebula-metad:9559",
        "--local_ip=nebula-graphd",
        "--port=9669"
      ]
    depends_on:
      nebula-metad:
        condition: service_started
      nebula-storaged:
        condition: service_started
    ports:
      - "9669:9669"

  nebula-init:
    image: ${NEBULA_CONSOLE_IMAGE:-vesoft/nebula-console:v3.8.0}
    depends_on:
      nebula-graphd:
        condition: service_started
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >
        sleep 15;
        nebula-console -addr=nebula-graphd -port=9669 -u=root -p=nebula -e="CREATE SPACE IF NOT EXISTS ${KG_GRAPH_DATABASE:-kg}(partition_num=1, replica_factor=1, vid_type=fixed_string(128)); USE ${KG_GRAPH_DATABASE:-kg};"
    restart: "no"

  migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../../migrations:/migrations:ro
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://postgres:postgres@postgres:5432/kg_service?sslmode=disable",
        "up"
      ]

  qdrant-init:
    image: curlimages/curl:8.10.1
    depends_on:
      qdrant:
        condition: service_started
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >
        until curl -fsS http://qdrant:6333/healthz >/dev/null; do sleep 2; done;
        code=$(curl -sS -o /dev/null -w "%{http_code}" -X PUT -H "Content-Type: application/json" "http://qdrant:6333/collections/${KG_VECTOR_COLLECTION:-kg_vectors}" -d '{"vectors":{"size":8,"distance":"Cosine"}}');
        case "$code" in 200|201|409) exit 0 ;; *) exit 1 ;; esac
    restart: "no"

  kg-service:
    build:
      context: ../../..
      dockerfile: Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant-init:
        condition: service_completed_successfully
      nebula-init:
        condition: service_completed_successfully
    environment:
      KG_HTTP_HOST: 0.0.0.0
      KG_HTTP_PORT: 8082
      KG_POSTGRES_HOST: postgres
      KG_POSTGRES_PORT: 5432
      KG_POSTGRES_USER: postgres
      KG_POSTGRES_PASSWORD: postgres
      KG_POSTGRES_DATABASE: kg_service
      KG_POSTGRES_SSLMODE: disable
      KG_REDIS_HOST: redis
      KG_REDIS_PORT: 6379
      KG_REDIS_DB: 0
      KG_RUNTIME_PROFILE: ${KG_RUNTIME_PROFILE}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-deterministic}
      VECTOR_ADAPTER: ${VECTOR_ADAPTER}
      KG_VECTOR_ENDPOINT: ${KG_VECTOR_ENDPOINT}
      KG_VECTOR_COLLECTION: ${KG_VECTOR_COLLECTION:-kg_vectors}
      GRAPH_ADAPTER: ${GRAPH_ADAPTER}
      KG_GRAPH_ENDPOINT: ${KG_GRAPH_ENDPOINT}
      KG_GRAPH_DATABASE: ${KG_GRAPH_DATABASE:-kg}
      FTS_ADAPTER: ${FTS_ADAPTER:-postgres}
    ports:
      - "8082:8082"
