version: '3.8'

services:
  postgres:
    image: ankane/pgvector:v0.5.1
    environment:
      POSTGRES_USER: supermemory
      POSTGRES_PASSWORD: supermemory
      POSTGRES_DB: supermemory
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  nats:
    image: nats:2.9-alpine
    command: ["-js"]
    ports:
      - "4222:4222"
      - "8222:8222"
