syntax = "proto3";
package vnp.memory.graphitiknowledge.v1;
option go_package = "vnp-memory/services/graphiti-knowledge/api/proto/v1;graphitiknowledgev1";

service GraphitiKnowledgeService {
  rpc Ping(PingRequest) returns (PingResponse);
}

message PingRequest {}
message PingResponse {
  string status = 1;
}
