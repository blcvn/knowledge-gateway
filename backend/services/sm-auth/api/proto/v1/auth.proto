syntax = "proto3";

package vnp.memory.smauth.v1;
option go_package = "vnp-memory/services/sm-auth/api/proto/v1;smauthv1";

service SmAuthService {
  rpc CreateAPIKey(CreateAPIKeyRequest) returns (CreateAPIKeyResponse);
  rpc ValidateAPIKey(ValidateAPIKeyRequest) returns (ValidateAPIKeyResponse);
  
  rpc Register(RegisterRequest) returns (AuthResponse);
  rpc Login(LoginRequest) returns (AuthResponse);
  rpc LoginWithGoogle(GoogleLoginRequest) returns (AuthResponse);

  // --- NEW RPCs (TASK-010 / SOL-001) ---
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc GetCurrentUser(GetCurrentUserRequest) returns (UserProfile);
}

message CreateAPIKeyRequest {
  string org_id = 1;
  string name = 2;
}

message CreateAPIKeyResponse {
  string raw_key = 1;
  string key_id = 2;
}

message ValidateAPIKeyRequest {
  string api_key = 1;
}

message ValidateAPIKeyResponse {
  bool is_valid = 1;
  string org_id = 2;
  string role = 3;
}

message RegisterRequest {
  string name = 1;
  string email = 2;
  string password = 3;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message GoogleLoginRequest {
  string id_token = 1;
}

message UserProfile {
  string id = 1;
  string name = 2;
  string email = 3;
  string role = 4;
}

message AuthResponse {
  string token = 1;
  UserProfile user = 2;
}

// --- NEW Messages (TASK-010 / SOL-001) ---

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {
  bool success = 1;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token = 1;
  int64  expires_in   = 2; // seconds
}

message GetCurrentUserRequest {
  string access_token = 1; // JWT to decode
}
