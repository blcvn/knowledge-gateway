syntax = "proto3";
package vnp.memory.memobasepipeline.v1;
option go_package = "vnp-memory/services/memobase-pipeline/api/proto/v1;memobasepipelinev1";

service MemobasePipelineService {
  rpc Ping(PingRequest) returns (PingResponse);
}

message PingRequest {}
message PingResponse {
  string status = 1;
}
