syntax = "proto3";
package vnp.memory.vnpdashboard.v1;
option go_package = "vnp-memory/services/vnp-dashboard/api/proto/v1;vnpdashboardv1";

import "google/protobuf/timestamp.proto";

// VnpDashboardService provides console dashboard data.
// Split from vnp-platform (FEAT-006).
service VnpDashboardService {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc GetHealth(GetHealthRequest) returns (GetHealthResponse);
  rpc GetMetrics(GetMetricsRequest) returns (GetMetricsResponse);
  rpc GetThroughput(GetThroughputRequest) returns (GetThroughputResponse);
  rpc GetHeatmap(GetHeatmapRequest) returns (GetHeatmapResponse);
}

message PingRequest {}
message PingResponse { string status = 1; }

message GetHealthRequest {}
message GetHealthResponse {
  repeated EngineHealth engines = 1;
}
message EngineHealth {
  string name = 1;
  string role = 2;
  string status = 3;
  double latency_p50_ms = 4;
  double latency_p95_ms = 5;
  int32 queue_depth = 6;
  int64 uptime_seconds = 7;
  google.protobuf.Timestamp last_check = 8;
}

message GetMetricsRequest {}
message GetMetricsResponse {
  int32 active_agents = 1;
  double recall_latency_p50_ms = 2;
  double recall_latency_p95_ms = 3;
  double context_savings_pct = 4;
  int64 graph_nodes_total = 5;
  int64 graph_edges_total = 6;
  int32 graph_growth_24h = 7;
  double error_rate_pct = 8;
  int32 active_sessions = 9;
  int32 active_profiles = 10;
  int32 memory_versions = 11;
}

message GetThroughputRequest {}
message GetThroughputResponse {
  string window = 1;
  map<string, MemoryFlowMetrics> engines = 2;
}
message MemoryFlowMetrics {
  double ingest_per_sec = 1;
  double recall_per_sec = 2;
  double embed_per_sec = 3;
  double profile_extractions_per_sec = 4;
  int32 queue_backlog = 5;
}

message GetHeatmapRequest {}
message GetHeatmapResponse {
  repeated HeatmapPoint points = 1;
}
message HeatmapPoint {
  double x = 1;
  double y = 2;
  double density = 3;
}
