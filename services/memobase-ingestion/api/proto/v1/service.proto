syntax = "proto3";
package vnp.memory.memobaseingestion.v1;
option go_package = "vnp-memory/services/memobase-ingestion/api/proto/v1;memobaseingestionv1";

service MemobaseIngestionService {
  rpc Ping(PingRequest) returns (PingResponse);
}

message PingRequest {}
message PingResponse {
  string status = 1;
}
