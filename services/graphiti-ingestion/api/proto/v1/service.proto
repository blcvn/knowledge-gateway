syntax = "proto3";
package vnp.memory.graphitiingestion.v1;
option go_package = "vnp-memory/services/graphiti-ingestion/api/proto/v1;graphitiingestionv1";

service GraphitiIngestionService {
  rpc Ping(PingRequest) returns (PingResponse);
}

message PingRequest {}
message PingResponse {
  string status = 1;
}
