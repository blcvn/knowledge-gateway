version: '3.8'

services:
  ov-storage:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9051:9051"
      - "9104:9104"
    environment:
      - GRPC_PORT=9051
      - HEALTH_PORT=9104
      - LOG_LEVEL=debug
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/vnp_memory?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - NATS_URL=nats://nats:4222
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - vnp-network

  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=vnp_memory
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vnp-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vnp-network

  nats:
    image: nats:2.10-alpine
    command: "-js"
    ports:
      - "4222:4222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/varz"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vnp-network

networks:
  vnp-network:
    driver: bridge
