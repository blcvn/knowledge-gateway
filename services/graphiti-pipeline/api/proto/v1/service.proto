syntax = "proto3";
package vnp.memory.graphitipipeline.v1;
option go_package = "vnp-memory/services/graphiti-pipeline/api/proto/v1;graphitipipelinev1";

service GraphitiPipelineService {
  rpc Ping(PingRequest) returns (PingResponse);
}

message PingRequest {}
message PingResponse {
  string status = 1;
}
