syntax = "proto3";
package vnp.memory.memobasecontext.v1;
option go_package = "vnp-memory/services/memobase-context/api/proto/v1;memobasecontextv1";

service MemobaseContextService {
  rpc Ping(PingRequest) returns (PingResponse);
}

message PingRequest {}
message PingResponse {
  string status = 1;
}
