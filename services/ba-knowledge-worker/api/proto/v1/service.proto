syntax = "proto3";
package vnp.memory.baknowledgeworker.v1;
option go_package = "vnp-memory/services/ba-knowledge-worker/api/proto/v1;baknowledgeworkerv1";

service BaKnowledgeWorkerService {
  rpc Ping(PingRequest) returns (PingResponse);
}

message PingRequest {}
message PingResponse {
  string status = 1;
}
