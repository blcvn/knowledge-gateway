syntax = "proto3";
package vnp.memory.cogneeingestion.v1;
option go_package = "vnp-memory/services/cognee-ingestion/api/proto/v1;cogneeingestionv1";

service CogneeIngestionService {
  rpc Ping(PingRequest) returns (PingResponse);
}

message PingRequest {}
message PingResponse {
  string status = 1;
}
