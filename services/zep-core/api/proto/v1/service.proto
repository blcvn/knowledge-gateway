syntax = "proto3";
package vnp.memory.zepcore.v1;
option go_package = "vnp-memory/services/zep-core/api/proto/v1;zepcorev1";

// ZepCoreService provides session management.
// Console endpoints: sessions (FEAT-014).
service ZepCoreService {
  rpc Ping(PingRequest) returns (PingResponse);

  // Console: GET /v1/console/sessions
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  // Console: GET /v1/console/sessions/live
  rpc ListLiveSessions(ListLiveSessionsRequest) returns (ListSessionsResponse);
  // Console: GET /v1/console/sessions/{id}
  rpc GetSession(GetSessionRequest) returns (Conversation);
  // Console: GET /v1/console/sessions/{id}/timeline
  rpc GetTimeline(GetTimelineRequest) returns (GetTimelineResponse);
}

message PingRequest {}
message PingResponse { string status = 1; }

message ListSessionsRequest {}
message ListSessionsResponse {
  repeated Session sessions = 1;
}
message Session {
  string id = 1;
  string user_id = 2;
  string title = 3;
  string agent_id = 4;
  string status = 5;
  int32 message_count = 6;
  string created_at = 7;
  string updated_at = 8;
}

message ListLiveSessionsRequest {}

message GetSessionRequest { string id = 1; }
message Conversation {
  string session_id = 1;
  repeated Message messages = 2;
}
message Message {
  string id = 1;
  string role = 2;
  string content = 3;
  string timestamp = 4;
  repeated string memory_sources = 5;
}

message GetTimelineRequest { string id = 1; }
message GetTimelineResponse {
  repeated TimelineEntry entries = 1;
}
message TimelineEntry {
  string type = 1;
  string content = 2;
  string timestamp = 3;
  map<string, string> metadata = 4;
}
