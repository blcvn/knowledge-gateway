    environment:
      GRPC_PORT: "9051"
      DATABASE_URL: "postgres://vnp:vnppassword@postgres:5432/vnp_memory?sslmode=disable"
      NATS_URL: "nats://nats:4222"
      VECTORDB_DRIVER: "pgvector"
    depends_on:
      postgres: { condition: service_healthy }
