# VNP Memory — Consolidated Development Stack (18 Services)
#
# Post-consolidation topology: 35 → 18 domain services + 1 gateway
# See: docs/product/architecture.md, specs/solutions/SOL-001
#
# Usage: docker compose -f deployment/docker/docker-compose.consolidated.yml up -d

networks:
  vnp-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  nats_data:
  minio_data:
  qdrant_data:

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # INFRASTRUCTURE
  # ═══════════════════════════════════════════════════════════════════════════

  postgres:
    image: pgvector/pgvector:pg17
    container_name: vnp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vnp
      POSTGRES_PASSWORD: vnppassword
      POSTGRES_DB: vnp_memory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vnp-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vnp -d vnp_memory"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vnp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - vnp-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: vnp-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/neo4jpassword
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    networks:
      - vnp-net
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "neo4jpassword", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  nats:
    image: nats:2.10-alpine
    container_name: vnp-nats
    restart: unless-stopped
    command: ["--jetstream", "--store_dir=/data"]
    ports:
      - "4222:4222"
      - "8222:8222"  # monitoring
    volumes:
      - nats_data:/data
    networks:
      - vnp-net

  minio:
    image: minio/minio:latest
    container_name: vnp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - vnp-net

  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: vnp-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - vnp-net

  # ═══════════════════════════════════════════════════════════════════════════
  # GATEWAY
  # ═══════════════════════════════════════════════════════════════════════════

  vnp-gateway:
    build:
      context: ../../backend/gateway
      dockerfile: Dockerfile
    container_name: vnp-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8081:8081"
      - "8082:8082"
      - "11080:11080"
    environment:
      REST_PORT: "8080"
      GRPC_PORT: "8081"
      MCP_PORT: "8082"
      HEALTH_PORT: "11080"
      AUTH_DEV_MODE: "true"
      POSTGRES_DSN: "postgres://vnp:vnppassword@postgres:5432/vnp_memory?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      NATS_URL: "nats://nats:4222"
      # Consolidated route targets (Phase 1 → Phase 2: split services)
      DASHBOARD_TARGET: "vnp-dashboard:9043"
      PIPELINES_TARGET: "vnp-pipelines:9044"
      INFRA_TARGET: "vnp-infra:9045"
      OBSERVABILITY_TARGET: "vnp-observability:9046"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      nats: { condition: service_started }
    networks:
      - vnp-net

  # ═══════════════════════════════════════════════════════════════════════════
  # PLATFORM SERVICES (5 — vnp-platform split into 4 + search-hub)
  # ═══════════════════════════════════════════════════════════════════════════

  vnp-dashboard:
    build:
      context: ../../backend/services/vnp-dashboard
      dockerfile: Dockerfile
    container_name: vnp-dashboard
    restart: unless-stopped
    ports:
      - "9043:9043"
    environment:
      GRPC_PORT: "9043"
      HEALTH_PORT: "9143"
      DATABASE_URL: "postgres://vnp:vnppassword@postgres:5432/vnp_memory?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      NATS_URL: "nats://nats:4222"
    depends_on:
      postgres: { condition: service_healthy }
    networks:
      - vnp-net

  vnp-pipelines:
    build:
      context: ../../backend/services/vnp-pipelines
      dockerfile: Dockerfile
    container_name: vnp-pipelines
    restart: unless-stopped
    ports:
      - "9044:9044"
    environment:
      GRPC_PORT: "9044"
      HEALTH_PORT: "9144"
      DATABASE_URL: "postgres://vnp:vnppassword@postgres:5432/vnp_memory?sslmode=disable"
      NATS_URL: "nats://nats:4222"
    depends_on:
      postgres: { condition: service_healthy }
    networks:
      - vnp-net

  vnp-infra:
    build:
      context: ../../backend/services/vnp-infra
      dockerfile: Dockerfile
    container_name: vnp-infra
    restart: unless-stopped
    ports:
      - "9045:9045"
    environment:
      GRPC_PORT: "9045"
      HEALTH_PORT: "9145"
      DATABASE_URL: "postgres://vnp:vnppassword@postgres:5432/vnp_memory?sslmode=disable"
    depends_on:
      postgres: { condition: service_healthy }
    networks:
      - vnp-net

  vnp-observability:
    build:
      context: ../../backend/services/vnp-observability
      dockerfile: Dockerfile
    container_name: vnp-observability
    restart: unless-stopped
    ports:
      - "9046:9046"
    environment:
      GRPC_PORT: "9046"
      HEALTH_PORT: "9146"
      DATABASE_URL: "postgres://vnp:vnppassword@postgres:5432/vnp_memory?sslmode=disable"
    depends_on:
      postgres: { condition: service_healthy }
    networks:
      - vnp-net

  vnp-search-hub:
    build:
      context: ../../backend/services/vnp-search-hub
      dockerfile: Dockerfile
    container_name: vnp-search-hub
    restart: unless-stopped
    ports:
      - "9042:9042"
    environment:
      GRPC_PORT: "9042"
      DATABASE_URL: "postgres://vnp:vnppassword@postgres:5432/vnp_memory?sslmode=disable"
      NATS_URL: "nats://nats:4222"
    depends_on:
      postgres: { condition: service_healthy }
    networks:
      - vnp-net

  # ═══════════════════════════════════════════════════════════════════════════
  # COGNEE ENGINE (2 services)
  # ═══════════════════════════════════════════════════════════════════════════

  cognee-pipeline:
    build:
      context: ../../backend/services/cognee-pipeline
      dockerfile: Dockerfile
    container_name: cognee-pipeline
    restart: unless-stopped
    ports:
      - "9011:9011"
    environment:
      GRPC_PORT: "9011"
      DATABASE_URL: "postgres://vnp:vnppassword@postgres:5432/vnp_memory?sslmode=disable"
      REDIS_URL: "redis://redis:6379/1"
      NATS_URL: "nats://nats:4222"
      NEO4J_URI: "bolt://neo4j:7687"
      QDRANT_URL: "http://qdrant:6333"
      VECTORDB_DRIVER: "qdrant"
    depends_on:
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      qdrant: { condition: service_started }
      nats: { condition: service_started }
    networks:
      - vnp-net

  cognee-search:
    build:
      context: ../../backend/services/cognee-search
      dockerfile: Dockerfile
    container_name: cognee-search
    restart: unless-stopped
    ports:
      - "9013:9013"
    environment:
      GRPC_PORT: "9013"
      DATABASE_URL: "postgres://vnp:vnppassword@postgres:5432/vnp_memory?sslmode=disable"
      NEO4J_URI: "bolt://neo4j:7687"
      QDRANT_URL: "http://qdrant:6333"
      NATS_URL: "nats://nats:4222"
    depends_on:
      postgres: { condition: service_healthy }
    networks:
      - vnp-net

  # ═══════════════════════════════════════════════════════════════════════════
  # GRAPHITI ENGINE (3 services)
