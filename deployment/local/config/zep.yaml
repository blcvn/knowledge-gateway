###############################################################################
# Zep CE — Configuration for local development
# Connects to shared infrastructure within Docker Compose network.
###############################################################################
log:
  level: info
  format: json

http:
  host: 0.0.0.0
  port: 8000
  max_request_size: 5242880

postgres:
  user: postgres
  password: postgres
  host: postgres
  port: 5432
  database: zep_db
  schema_name: public
  read_timeout: 30
  write_timeout: 30
  max_open_connections: 10

carbon:
  locale: en

graphiti:
  service_url: http://graphiti-zep:8003

# Set a proper secret in production
api_secret:

telemetry:
  disabled: true
  organization_name:
