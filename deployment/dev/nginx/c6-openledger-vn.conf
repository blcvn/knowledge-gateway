# ── c6-openledger-nginx.conf ──────────────────────────────────────────────────
# Domain  : c6.openledger.vn
# Service : VNP Memory Platform — Monolith (API + UI) + Engine MCP Services
# Backend : 172.20.2.39
# Proxy   : 172.20.2.16 (103.67.184.32)
# ──────────────────────────────────────────────────────────────────────────────

# ── WebSocket connection upgrade map ──────────────────────────────────────────
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Upstreams ─────────────────────────────────────────────────────────────────

# VNP Memory Monolith — unified REST API + embedded UI console
upstream memory_monolith {
    server 172.20.2.39:8080;
    keepalive 32;
}

# VNP Memory MCP — AI agent interface
upstream memory_mcp {
    server 172.20.2.39:8082;
    keepalive 16;
}

upstream cognee_ui {
    server 172.20.2.39:3000;
    keepalive 16;
}

upstream cognee_api {
    server 172.20.2.39:8000;
    keepalive 16;
}

upstream graphiti_api {
    server 172.20.2.39:8001;
    keepalive 16;
}

upstream zep_api {
    server 172.20.2.39:8002;
    keepalive 16;
}

upstream openviking_api {
    server 172.20.2.39:1933;
    keepalive 16;
}

upstream kgs_platform_api {
    server 172.20.2.39:8010;
    keepalive 16;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name c6.openledger.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS Main Server ─────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name c6.openledger.vn;

    # ── TLS (Let's Encrypt) ──────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/c6.openledger.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/c6.openledger.vn/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/c6.openledger.vn/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL_c6:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    nosniff   always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options           SAMEORIGIN always;

    client_max_body_size   50m;
    proxy_read_timeout    300s;
    proxy_connect_timeout  10s;
    proxy_send_timeout    300s;

    # ─────────────────────────────────────────────────────────────────────────
    # VNP Memory REST API (/v1/) — Monolith
    # Routes all /v1/* API calls to the Go monolith backend
    # ─────────────────────────────────────────────────────────────────────────
    location /v1/ {
        proxy_pass http://memory_monolith;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # WebSocket support for /v1/console/ws
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # VNP Memory MCP (/mcp/) — AI Agent Interface
    # ─────────────────────────────────────────────────────────────────────────
    location /mcp/ {
        rewrite ^/mcp/(.*) /$1 break;
        proxy_pass http://memory_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # SSE support for MCP streaming
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # Static Assets (/assets/) — Monolith embedded UI
    # Cache JS/CSS/fonts aggressively since filenames are content-hashed
    # ─────────────────────────────────────────────────────────────────────────
    location /assets/ {
        proxy_pass http://memory_monolith;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Immutable cache for content-hashed assets
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ─────────────────────────────────────────────────────────────────────────
    # Cognee MCP API (/cognee/)
    # ─────────────────────────────────────────────────────────────────────────
    location /cognee/ {
        rewrite ^/cognee/(.*) /$1 break;
        proxy_pass http://cognee_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # SSE + WebSocket support for MCP streaming
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # Cognee UI — Legacy frontend (/cognee-ui/)
    # ─────────────────────────────────────────────────────────────────────────
    location /cognee-ui/ {
        rewrite ^/cognee-ui/(.*) /$1 break;
        proxy_pass http://cognee_ui;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    # ─────────────────────────────────────────────────────────────────────────
    # Graphiti MCP (/graphiti/)
    # ─────────────────────────────────────────────────────────────────────────
    location /graphiti/ {
        rewrite ^/graphiti/(.*) /$1 break;
        proxy_pass http://graphiti_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # Zep MCP (/zep/)
    # ─────────────────────────────────────────────────────────────────────────
    location /zep/ {
        rewrite ^/zep/(.*) /$1 break;
        proxy_pass http://zep_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # OpenViking MCP (/openviking/)
    # ─────────────────────────────────────────────────────────────────────────
    location /openviking/ {
        rewrite ^/openviking/(.*) /$1 break;
        proxy_pass http://openviking_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # KGS Platform MCP (/kgs-platform/)
    # ─────────────────────────────────────────────────────────────────────────
    location /kgs-platform/ {
        rewrite ^/kgs-platform/(.*) /$1 break;
        proxy_pass http://kgs_platform_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # Root (/) — VNP Memory Console (embedded SPA in monolith)
    # This MUST be last — catches all unmatched routes
    # ─────────────────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://memory_monolith;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # WebSocket support
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html { root /usr/share/nginx/html; }
}

