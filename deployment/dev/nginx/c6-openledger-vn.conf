# ── c6-openledger-nginx.conf ──────────────────────────────────────────────────
# Domain  : c6.openledger.vn
# Service : VNP Memory — Cognee UI + MCP Services
# Upstream: 172.20.2.39
# ──────────────────────────────────────────────────────────────────────────────

# ── Upstreams ─────────────────────────────────────────────────────────────────

upstream cognee_ui {
    server 172.20.2.39:3000;
    keepalive 16;
}

upstream cognee_api {
    server 172.20.2.39:8000;
    keepalive 16;
}

upstream graphiti_api {
    server 172.20.2.39:8001;
    keepalive 16;
}

upstream zep_api {
    server 172.20.2.39:8002;
    keepalive 16;
}

upstream openviking_api {
    server 172.20.2.39:1933;
    keepalive 16;
}

upstream kgs_platform_api {
    server 172.20.2.39:8010;
    keepalive 16;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name c6.openledger.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS Main Server ─────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name c6.openledger.vn;

    # ── TLS (Let's Encrypt) ──────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/c6.openledger.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/c6.openledger.vn/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/c6.openledger.vn/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL_c6:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    nosniff   always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options           SAMEORIGIN always;

    client_max_body_size   50m;
    proxy_read_timeout    300s;
    proxy_connect_timeout  10s;
    proxy_send_timeout    300s;

    # ─────────────────────────────────────────────────────────────────────────
    # Cognee UI — Root path (/)
    # ─────────────────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://cognee_ui;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # WebSocket support (Next.js HMR / live updates)
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    # ─────────────────────────────────────────────────────────────────────────
    # Cognee MCP API (/cognee/)
    # ─────────────────────────────────────────────────────────────────────────
    location /cognee/ {
        rewrite ^/cognee/(.*) /$1 break;
        proxy_pass http://cognee_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # SSE + WebSocket support for MCP streaming
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # Graphiti MCP (/graphiti/)
    # ─────────────────────────────────────────────────────────────────────────
    location /graphiti/ {
        rewrite ^/graphiti/(.*) /$1 break;
        proxy_pass http://graphiti_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # Zep MCP (/zep/)
    # ─────────────────────────────────────────────────────────────────────────
    location /zep/ {
        rewrite ^/zep/(.*) /$1 break;
        proxy_pass http://zep_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # OpenViking MCP (/openviking/)
    # ─────────────────────────────────────────────────────────────────────────
    location /openviking/ {
        rewrite ^/openviking/(.*) /$1 break;
        proxy_pass http://openviking_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # KGS Platform MCP (/kgs-platform/)
    # ─────────────────────────────────────────────────────────────────────────
    location /kgs-platform/ {
        rewrite ^/kgs-platform/(.*) /$1 break;
        proxy_pass http://kgs_platform_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html { root /usr/share/nginx/html; }
}
