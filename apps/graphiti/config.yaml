# Graphiti App — Unified Configuration Reference
#
# Configuration is loaded from environment variables (takes precedence).
# This file documents all available settings with their defaults.

server:
  rest_port: 8080
  mcp_port: 8082
  health_port: 9090
  shutdown_timeout: 30s
  log_level: info

# Embedded service gRPC ports
services:
  ingestion_port: 9021
  search_port: 9022
  knowledge_port: 9023
  store_port: 9024
  pipeline_port: 9025

auth:
  jwt_public_key: ""
  jwt_issuer: "vnp-memory"
  jwt_audience: "vnp-api"
  dev_mode: true                    # Set false in production

postgres:
  dsn: ""                           # Gateway key store (optional)
  max_conns: 20
  min_conns: 5

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

# NATS JetStream for async service-to-service events
nats:
  url: "nats://localhost:4222"
  creds_file: ""
  stream_name: "graphiti"

# Neo4j graph database (primary data store)
neo4j:
  uri: "bolt://localhost:7687"
  username: "neo4j"
  password: ""
  database: "neo4j"

# LLM Provider (used by graphiti-knowledge)
llm:
  provider: "openai"
  api_key: ""                       # Required in production
  model: "gpt-4o"
  small_model: "gpt-4o-mini"
  temperature: 0.0
  base_url: ""                      # Override for generic/ollama

# Embedder (used by graphiti-knowledge)
embedder:
  provider: "openai"
  model: "text-embedding-3-small"
  dimensions: 1536

# Reranker (used by graphiti-search via knowledge)
reranker:
  provider: "openai"
  model: "gpt-4o-mini"

cors:
  allowed_origins: "*"
  allow_credentials: true

timeout:
  default: 30s
  ingestion: 300s
  search: 30s
  pipeline: 600s
