# =============================================================================
# Cognee App — Docker Compose for Local Development
# Starts the monolith + all infrastructure dependencies
# =============================================================================
#
# Usage:
#   docker compose up -d       # Start everything
#   docker compose logs -f     # Follow logs
#   docker compose down        # Stop everything
#
# Health check:
#   curl http://localhost:11080/healthz
#   curl http://localhost:11080/readyz
#   curl http://localhost:8080/healthz

services:
  # ── Cognee Monolith App ──────────────────────────────────────────────────
  cognee-app:
    build:
      context: ../..
      dockerfile: apps/cognee/Dockerfile
    ports:
      - "8080:8080"     # Gateway REST API
      - "11080:11080"   # Aggregated health probes
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      neo4j:
        condition: service_started
      qdrant:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
    env_file: .env.example
    restart: unless-stopped

  # ── Infrastructure ───────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cognee
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2.10-alpine
    ports: ["4222:4222", "8222:8222"]
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    volumes:
      - nats_data:/data

  neo4j:
    image: neo4j:5-community
    ports: ["7474:7474", "7687:7687"]
    environment:
      NEO4J_AUTH: "neo4j/password"
    volumes:
      - neo4j_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    ports: ["9000:9000", "9001:9001"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  nats_data:
  neo4j_data:
  qdrant_data:
  minio_data:
