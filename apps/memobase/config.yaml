# Memobase App — Unified Configuration Reference
#
# Configuration is loaded from environment variables (takes precedence).
# This file documents all available settings with their defaults.

server:
  rest_port: 8080
  mcp_port: 8082
  health_port: 9090
  shutdown_timeout: 30s
  log_level: info

# Embedded service gRPC ports
services:
  ingestion_port: 9041
  engine_port: 9042
  context_port: 9043
  pipeline_port: 9044

auth:
  jwt_public_key: ""
  jwt_issuer: "memobase"
  jwt_audience: "memobase-api"
  dev_mode: true                    # Set false in production
  root_token: ""

postgres:
  dsn: ""                           # Required: postgres://user:pass@host/db
  max_conns: 25
  min_conns: 5

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

# NATS JetStream for async service-to-service events
nats:
  url: "nats://localhost:4222"
  creds_file: ""
  stream_name: "memobase"

# LLM Provider (used by memobase-engine for profile extraction)
llm:
  provider: "bifrost"
  api_key: ""                       # Required in production
  model: "gpt-4o-mini"
  small_model: "gpt-4o-mini"
  base_url: ""                      # Override for generic/ollama

# Embedder (used by memobase-event for vector search)
embedder:
  provider: "openai"
  model: "text-embedding-3-small"
  dimension: 1536
  enabled: true

cors:
  allowed_origins: "*"
  allow_credentials: true

timeout:
  default: 30s
  ingestion: 120s
  context: 30s
  engine: 300s
