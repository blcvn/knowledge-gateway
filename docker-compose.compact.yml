# VNP Memory Platform — Compact Deployment
# All platform services consolidated into vnp-platform binary
# Use: docker compose -f docker-compose.compact.yml up

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vnp
      POSTGRES_PASSWORD: vnppassword
      POSTGRES_DB: vnp_memory
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vnp"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"
    command: ["-js"]

  vnp-platform:
    build:
      context: ./services/vnp-platform
      dockerfile: Dockerfile
    environment:
      GRPC_PORT: "9050"
      HEALTH_PORT: "9103"
      DATABASE_URL: "postgres://vnp:vnppassword@postgres:5432/vnp_memory?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      NATS_URL: "nats://nats:4222"
      DEPLOYMENT_MODE: "compact"
    ports:
      - "9050:9050"
      - "9103:9103"
    depends_on:
      postgres:
        condition: service_healthy

  vnp-gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    environment:
      REST_PORT: "8080"
      AUTH_DEV_MODE: "true"
      POSTGRES_DSN: "postgres://vnp:vnppassword@postgres:5432/vnp_memory?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      NATS_URL: "nats://nats:4222"
    ports:
      - "8080:8080"
    depends_on:
      - vnp-platform

volumes:
  pgdata:
