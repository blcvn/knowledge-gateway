openapi: 3.1.0
info:
  title: KG Service API
  version: 0.1.0-bootstrap
  description: |
    Versioned API specification for the current bootstrap HTTP surface exposed by `kg-service`.

    This document follows the live runtime contract registered in `internal/bootstrap/app.go`.
    It documents the current bootstrap implementation rather than historical TDD examples.
servers:
  - url: http://127.0.0.1:8082
    description: Local bootstrap server
security:
  - bearerAuth: []
tags:
  - name: Health
  - name: Access
  - name: Tenants
  - name: Ontology
  - name: Read
  - name: Search
  - name: Write
  - name: Integrity
  - name: MCP
paths:
  /healthz:
    get:
      tags: [Health]
      summary: Health check
      description: Public route that reports bootstrap service and dependency configuration.
      security: []
      responses:
        '200':
          description: Service health payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthzResponse'
  /v1/access/resolve:
    get:
      tags: [Access]
      summary: Resolve caller visibility
      responses:
        '200':
          description: Visible owners for the authenticated caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/access/grants:
    post:
      tags: [Access]
      summary: Create a sharing grant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantCreateRequest'
      responses:
        '201':
          description: Grant created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Access]
      summary: List sharing grants
      parameters:
        - $ref: '#/components/parameters/GrantorTenantID'
        - $ref: '#/components/parameters/GranteeTenantID'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated grant list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantListResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/access/grants/{id}:
    delete:
      tags: [Access]
      summary: Revoke a sharing grant
      parameters:
        - $ref: '#/components/parameters/GrantID'
      responses:
        '200':
          description: Grant revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevocationResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/access/audit:
    get:
      tags: [Access]
      summary: List audit log entries
      parameters:
        - $ref: '#/components/parameters/ResourceOwnerTenantID'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated audit log list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogListResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/tenants:
    post:
      tags: [Tenants]
      summary: Create a tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreateRequest'
      responses:
        '201':
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/tenants/{tenant_id}:
    get:
      tags: [Tenants]
      summary: Get a tenant
      parameters:
        - $ref: '#/components/parameters/TenantID'
      responses:
        '200':
          description: Tenant details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Tenants]
      summary: Update a tenant
      parameters:
        - $ref: '#/components/parameters/TenantID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUpdateRequest'
      responses:
        '200':
          description: Tenant updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Tenants]
      summary: Suspend a tenant
      parameters:
        - $ref: '#/components/parameters/TenantID'
      responses:
        '200':
          description: Tenant suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/tenants/{tenant_id}/apps:
    post:
      tags: [Tenants]
      summary: Create an app for a tenant
      parameters:
        - $ref: '#/components/parameters/TenantID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppCreateRequest'
      responses:
        '201':
          description: App created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Tenants]
      summary: List apps for a tenant
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated app list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/tenants/{tenant_id}/apps/{app_id}/rotate-key:
    post:
      tags: [Tenants]
      summary: Rotate an app API key
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/AppID'
      responses:
        '200':
          description: New API key issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotateKeyResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/tenants/{tenant_id}/apps/{app_id}:
    delete:
      tags: [Tenants]
      summary: Revoke an app
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/AppID'
      responses:
        '200':
          description: App revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevocationResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/tenants/{tenant_id}/ontology/domains:
    post:
      tags: [Ontology]
      summary: Create a domain
      parameters:
        - $ref: '#/components/parameters/TenantID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainCreateRequest'
      responses:
        '201':
          description: Domain created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/tenants/{tenant_id}/ontology/domains/{domain_id}/node-types:
    post:
      tags: [Ontology]
      summary: Create a node type schema
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/DomainID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeTypeCreateRequest'
      responses:
        '201':
          description: Node type schema created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeTypeSchema'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/tenants/{tenant_id}/ontology/domains/{domain_id}/rel-types:
    post:
      tags: [Ontology]
      summary: Create a relationship type schema
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/DomainID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelTypeCreateRequest'
      responses:
        '201':
          description: Relationship type schema created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelTypeSchema'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/tenants/{tenant_id}/ontology/effective:
    get:
      tags: [Ontology]
      summary: List effective visible domains for a tenant
      parameters:
        - $ref: '#/components/parameters/TenantID'
      responses:
        '200':
          description: Effective domain list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectiveOntologyResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/tenants/{tenant_id}/ontology/domains/{domain_id}/query-templates:
    post:
      tags: [Ontology]
      summary: Create a query template
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/DomainID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryTemplateCreateRequest'
      responses:
        '201':
          description: Query template created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryTemplate'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/tenants/{tenant_id}/ontology/domains/{domain_id}/query-templates/{name}/activate:
    put:
      tags: [Ontology]
      summary: Activate a query template
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/DomainID'
        - $ref: '#/components/parameters/TemplateNamePath'
      responses:
        '200':
          description: Query template activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryTemplate'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/tenants/{tenant_id}/ontology/domains/{domain_id}/status-field-config:
    post:
      tags: [Ontology]
      summary: Upsert status field configuration
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/DomainID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusFieldConfigRequest'
      responses:
        '201':
          description: Status field configuration upserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusFieldConfig'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/ontology/domains/{domain_id}:
    get:
      tags: [Ontology]
      summary: Get domain details
      parameters:
        - $ref: '#/components/parameters/DomainID'
      responses:
        '200':
          description: Domain details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainDetailsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/kg/read/templates:
    get:
      tags: [Read]
      summary: List active templates
      parameters:
        - $ref: '#/components/parameters/DomainIDQuery'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated template list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/kg/read/template/{domain_id}/{template_name}:
    post:
      tags: [Read]
      summary: Execute a registered query template
      description: Generic route backed by active domain query templates rather than hard-coded domain-specific routes.
      parameters:
        - $ref: '#/components/parameters/DomainID'
        - $ref: '#/components/parameters/TemplateName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateExecutionRequest'
      responses:
        '200':
          description: Template execution result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateExecutionResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '504':
          $ref: '#/components/responses/TimeoutError'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/kg/read/nodes/{id}:
    get:
      tags: [Read]
      summary: Fetch a visible node
      parameters:
        - $ref: '#/components/parameters/NodeID'
      responses:
        '200':
          description: Node details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/kg/search/semantic:
    post:
      tags: [Search]
      summary: Run semantic search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SemanticSearchRequest'
      responses:
        '200':
          description: Semantic search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SemanticSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/kg/search/rag:
    post:
      tags: [Search]
      summary: Run RAG-style retrieval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SemanticSearchRequest'
      responses:
        '200':
          description: RAG retrieval result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SemanticSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/kg/write/nodes:
    post:
      tags: [Write]
      summary: Create a node
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeCreateRequest'
      responses:
        '202':
          description: Node accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/kg/write/nodes/{id}:
    put:
      tags: [Write]
      summary: Update a node
      parameters:
        - $ref: '#/components/parameters/NodeID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeUpdateRequest'
      responses:
        '200':
          description: Node updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeUpdateResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Write]
      summary: Soft-delete a node
      parameters:
        - $ref: '#/components/parameters/NodeID'
      responses:
        '200':
          description: Node soft-deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeDeleteResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/kg/write/relationships:
    post:
      tags: [Write]
      summary: Create a relationship
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelationshipCreateRequest'
      responses:
        '201':
          description: Relationship created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/kg/write/ingest/document:
    post:
      tags: [Write]
      summary: Queue document ingest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestDocumentRequest'
      responses:
        '202':
          description: Ingest accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestJobResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/kg/write/ingest/jobs/{job_id}:
    get:
      tags: [Write]
      summary: Get ingest job status
      parameters:
        - $ref: '#/components/parameters/JobID'
      responses:
        '200':
          description: Ingest job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestJobResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/kg/integrity/tenant/{tenant_id}:
    get:
      tags: [Integrity]
      summary: Get tenant integrity status
      parameters:
        - $ref: '#/components/parameters/TenantID'
      responses:
        '200':
          description: Tenant integrity report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantIntegrityResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/kg/integrity/missing-bridges:
    get:
      tags: [Integrity]
      summary: List missing bridge candidates
      parameters:
        - $ref: '#/components/parameters/TenantIDQueryRequired'
      responses:
        '200':
          description: Missing bridge candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissingBridgeListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/mcp/connect:
    get:
      tags: [MCP]
      summary: Open an MCP session
      description: Returns an SSE stream that emits a `session` event containing `session_id`.
      responses:
        '200':
          description: MCP session stream
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  event: session
                  data: {"session_id":"mcp_1234567890"}
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
  /v1/mcp/messages/{session_id}:
    post:
      tags: [MCP]
      summary: Post a JSON-RPC MCP message
      parameters:
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JSONRPCRequest'
      responses:
        '200':
          description: JSON-RPC result or error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONRPCResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
  parameters:
    TenantID:
      name: tenant_id
      in: path
      required: true
      schema:
        type: string
      description: Tenant identifier.
    AppID:
      name: app_id
      in: path
      required: true
      schema:
        type: string
      description: App identifier.
    GrantID:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Grant identifier.
    DomainID:
      name: domain_id
      in: path
      required: true
      schema:
        type: string
      description: Domain identifier.
    TemplateName:
      name: template_name
      in: path
      required: true
      schema:
        type: string
      description: Query template name.
    TemplateNamePath:
      name: name
      in: path
      required: true
      schema:
        type: string
      description: Query template name used by the activation route.
    NodeID:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Node identifier.
    JobID:
      name: job_id
      in: path
      required: true
      schema:
        type: string
      description: Ingest job identifier.
    SessionID:
      name: session_id
      in: path
      required: true
      schema:
        type: string
      description: MCP session identifier.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Page size. Runtime normalizes missing or non-positive values to 20 and caps values above 100.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Cursor returned by a previous list response.
    GrantorTenantID:
      name: grantor_tenant_id
      in: query
      required: false
      schema:
        type: string
      description: Optional grantor tenant filter. Current handler expects UUID-shaped values when provided.
    GranteeTenantID:
      name: grantee_tenant_id
      in: query
      required: false
      schema:
        type: string
      description: Optional grantee tenant filter. Current handler expects UUID-shaped values when provided.
    ResourceOwnerTenantID:
      name: resource_owner_tenant_id
      in: query
      required: false
      schema:
        type: string
      description: Optional audit owner tenant filter. Current handler expects UUID-shaped values when provided.
    DomainIDQuery:
      name: domain_id
      in: query
      required: false
      schema:
        type: string
      description: Domain filter for visible active templates.
    TenantIDQueryRequired:
      name: tenant_id
      in: query
      required: true
      schema:
        type: string
      description: Tenant identifier required by the integrity missing-bridges endpoint.
  responses:
    BadRequestError:
      description: Malformed request or unsupported parameter shape
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnauthorizedError:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ForbiddenError:
      description: Authenticated caller lacks permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFoundError:
      description: Requested resource was not found in visible scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationError:
      description: Request failed schema or business validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooManyRequestsError:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TimeoutError:
      description: Request timed out
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: Unexpected internal failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    HealthzResponse:
      type: object
      required: [service, postgres, redis]
      properties:
        service:
          type: string
        postgres:
          type: object
          required: [dsn]
          properties:
            dsn:
              type: string
        redis:
          type: object
          required: [address, db]
          properties:
            address:
              type: string
            db:
              type: integer
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details: {}
        request_id:
          type: string
    VisibleOwner:
      type: object
      required: [tenant_id, source]
      properties:
        tenant_id:
          type: string
        app_id:
          type: string
        permission:
          type: string
        scope_type:
          type: string
        scope_value:
          type: string
        source:
          type: string
    ResolveResponse:
      type: object
      required: [tenant_id, app_id, visible_owners]
      properties:
